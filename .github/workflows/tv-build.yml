name: TV Test Build

# Builds a debug APK from the combined tv-test-build integration branch and
# uploads it as a downloadable artifact, so the merged PRs can be sideloaded
# and tested on an Android TV without a local Flutter/Xcode toolchain.
# Debug build needs no signing secrets, so it runs on a fork.
#
# Speed: the first run is slow because every cache is cold. It then caches the
# Rust bridge tool, the compiled Rust crate (rust-cache) and the Gradle deps, so
# later runs only recompile what changed. Builds arm64-v8a only (physical
# Android TVs are arm64) — one ABI instead of three, ~half the native work.
on:
  push:
    branches: [tv-test-build]
  workflow_dispatch:

concurrency:
  group: tv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
        env:
          JAVA_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m"

      - name: Setup Gradle properties for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512m -XX:+UseG1GC" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.18.1"

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      # Cache the compiled Rust crate (rust/) so the native bridge isn't rebuilt
      # from scratch every run — the single biggest repeat-build speedup.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Cache the frb codegen binary so `cargo install` (a multi-minute compile)
      # only runs on the first build, not every time.
      - name: Cache flutter_rust_bridge_codegen
        id: cache-frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ runner.os }}-v1

      - name: Install flutter_rust_bridge_codegen
        if: steps.cache-frb.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen

      # Cache Gradle caches + wrapper so Android dependency resolution and the
      # build don't re-download / recompute everything each run.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # arm64-v8a only: physical Android TVs are arm64, so skipping armv7 + x86_64
      # cuts the native Rust + Gradle work roughly in half vs a fat APK.
      - name: Build debug APK (arm64-v8a)
        run: |
          export GRADLE_OPTS="-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"
          flutter build apk --debug --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangayomi-tv-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
