name: TV Test Build

# Builds a debug APK from the combined tv-test-build integration branch and
# uploads it as a downloadable artifact, so the merged PRs can be sideloaded
# and tested on an Android TV without a local Flutter/Xcode toolchain.
# Debug build needs no signing secrets, so it runs on a fork.
on:
  push:
    branches: [tv-test-build]
  workflow_dispatch:

concurrency:
  group: tv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.18.1"

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install flutter_rust_bridge_codegen
        run: cargo install 'flutter_rust_bridge_codegen'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangayomi-tv-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
