name: iOS beta (ad-hoc signed)

# Ad-hoc-signed iOS build for testers. Signed in CI with your OWN Apple
# Developer distribution cert + ad-hoc provisioning profile (IOS_* secrets), and
# the bundle id overridden (zsign -b) to your registered App ID. The result
# installs directly on the profile's registered device UDIDs with no sideloader
# re-signing — which is what was crashing playback. Tag-triggered (ios-beta-*).
#
# Requires repo secrets: IOS_P12_BASE64, IOS_P12_PASSWORD,
# IOS_MOBILEPROVISION_BASE64. Set IOS_BUNDLE_ID below to match the App ID your
# ad-hoc profile was created for (a bundle id under YOUR team, not kodjodevf's).
on:
  push:
    tags:
      - "ios-beta-*"
  workflow_dispatch:

env:
  ZSIGN_VERSION: "0.7"
  IOS_BUNDLE_ID: "com.kodjodevf.mangayomi.tvbeta"

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign

      - name: Ad-hoc sign with zsign
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 -d > certificate.p12
          echo "$PROFILE_BASE64" | base64 -d > profile.mobileprovision
          curl -L -o zsign.zip "https://github.com/zhlynn/zsign/releases/download/v${ZSIGN_VERSION}/zsign-v${ZSIGN_VERSION}-macos-x64.zip"
          unzip zsign.zip
          chmod +x zsign || chmod +x zsign-*
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ./zsign -f -b "$IOS_BUNDLE_ID" -k certificate.p12 -p "$P12_PASSWORD" -m profile.mobileprovision Payload/Runner.app
          zip -qry mangayomi-ios-adhoc.ipa Payload
          ls -lah mangayomi-ios-adhoc.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: mangayomi-ios-adhoc-ipa
          path: mangayomi-ios-adhoc.ipa
          if-no-files-found: error
